<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F5E9"/>
      <stop offset="1" stop-color="#F5F7FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8B57"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2E8B57" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="900" rx="44" fill="url(#bg)"/>

  <!-- bag body -->
  <g filter="url(#shadow)">
    <rect x="250" y="320" width="700" height="440" rx="44" fill="#FFFFFF" stroke="rgba(46,139,87,0.22)" stroke-width="10"/>
    <path d="M340 320c0-132 104-220 260-220s260 88 260 220" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round"/>
    <path d="M330 480h540" stroke="rgba(27,94,32,0.18)" stroke-width="10" stroke-linecap="round"/>
    <rect x="520" y="520" width="160" height="110" rx="22" fill="rgba(46,139,87,0.10)" stroke="rgba(46,139,87,0.24)" stroke-width="8"/>
    <circle cx="560" cy="575" r="12" fill="#2E8B57" opacity="0.7"/>
    <circle cx="640" cy="575" r="12" fill="#2E8B57" opacity="0.7"/>
  </g>

  <!-- subtle texture -->
  <g opacity="0.08">
    <path d="M140 140c140 40 260 40 400 0s260-40 520 0" stroke="#1B5E20" stroke-width="16" stroke-linecap="round"/>
    <path d="M120 820c160-70 300-70 460 0s300 70 520 0" stroke="#2E8B57" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
