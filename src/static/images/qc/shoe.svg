<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F5E9"/>
      <stop offset="1" stop-color="#F5F7FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8B57"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2E8B57" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="900" rx="44" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- sole -->
    <path d="M210 640c0-46 38-84 84-84h560c54 0 104 22 148 66l44 44c24 24 38 56 38 90v18H210v-134z"
          fill="#FFFFFF" stroke="rgba(46,139,87,0.22)" stroke-width="10" />
    <!-- upper -->
    <path d="M320 560c30-122 140-230 280-230h90c70 0 132 28 186 82l46 46c16 16 26 38 26 62v40H320z"
          fill="rgba(46,139,87,0.10)" stroke="url(#accent)" stroke-width="12" />
    <!-- lace holes -->
    <g fill="#2E8B57" opacity="0.65">
      <circle cx="640" cy="460" r="12"/><circle cx="700" cy="460" r="12"/>
      <circle cx="640" cy="510" r="12"/><circle cx="700" cy="510" r="12"/>
    </g>
    <!-- toe cap highlight -->
    <path d="M860 560c-40 48-108 78-186 78H520" fill="none" stroke="rgba(27,94,32,0.18)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g opacity="0.08">
    <path d="M120 180c160 50 300 50 460 0s300-50 520 0" stroke="#1B5E20" stroke-width="16" stroke-linecap="round"/>
    <path d="M160 780c180-60 320-60 480 0s300 60 500 0" stroke="#2E8B57" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
